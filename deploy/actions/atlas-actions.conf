# Install as /etc/systemd/system/atlas.service.d/50-atlas-actions.conf only after
# review. This template enables nothing. Keep action storage across redeploys.
[Service]
Environment=ATLAS_ACTIONS=
Environment=ATLAS_RESTART_UNITS=
Environment=ATLAS_RESTART_CONTAINERS=
Environment=ATLAS_KILL_USERS=
Environment=ATLAS_APT_UNIT=atlas-apt-upgrade.service
Environment=ATLAS_ACTION_DIR=<ATLAS_DIR>/atlas-actions
# Optional, operator only: enable kill-process AND name specific non-root users
# in ATLAS_KILL_USERS before granting this capability. Never a wildcard sudo kill.
# AmbientCapabilities=CAP_KILL
